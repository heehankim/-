<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인간 빙고 × SECRET MBTI</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#15213c;background:#f1f4f9}*{box-sizing:border-box}body{margin:0}header{background:#142d62;color:white;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(21px,3vw,36px);margin:0}h2{margin:0 0 14px}p{line-height:1.6}nav{display:flex;gap:8px;flex-wrap:wrap}button,input,select{font:inherit}button{background:#225fe2;border:0;border-radius:11px;color:white;padding:12px 17px;cursor:pointer;font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}.ghost{background:#e8efff;color:#21468e}.danger{background:#a52743}.selected{outline:3px solid #80a7ff}.wrap{max-width:1200px;margin:22px auto;padding:0 16px}.card{background:white;border-radius:20px;padding:24px;margin-bottom:18px;box-shadow:0 4px 18px #12244a10}.muted{color:#65738d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.person{background:#f2f6ff;border:2px solid #dbe5fb;border-radius:14px;padding:16px 8px;text-align:center;min-width:0}.person strong{display:block;font-size:clamp(12px,2vw,20px);overflow-wrap:anywhere}.person .avatar{font-size:32px}.question{font-size:clamp(21px,3vw,34px);font-weight:800;text-align:center;padding:22px 0}.answers{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.answers button{min-width:120px;font-size:24px;padding:22px}.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.bingo input{width:100%;min-width:0;border:1px solid #c6d5ed;border-radius:6px;padding:8px 3px;text-align:center;font-size:12px;height:67px}.bingo input.special{background:#e0edff;border-color:#6e9ae5}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.row>*{max-width:100%}input[type=text],input[type=password]{border:1px solid #ccd6e5;border-radius:9px;padding:12px;max-width:100%}.bar{height:16px;border-radius:8px;background:#e6ebf3;overflow:hidden}.bar span{display:block;height:100%;background:#346fe5}.stat{font-size:32px;font-weight:900;color:#225fe2}.hidden{display:none!important}.tag{background:#e7edfa;color:#244783;border-radius:30px;padding:6px 12px;font-weight:700}.big{font-size:clamp(30px,5vw,65px);font-weight:900}.screen .card{text-align:center}.screen .person{padding:30px 8px}.screen .person .avatar{font-size:52px}.screen .stat{font-size:52px}.screen .qr{width:min(240px,55vw)}.small{font-size:13px}.settings input{width:140px}footer{padding:20px;text-align:center;color:#748098}@media(max-width:600px){.card{padding:16px}.five .person{padding:10px 2px}.person .avatar{font-size:22px}.bingo input{font-size:10px;height:54px}.settings input{width:100%}}</style></head><body><header><div><h1>인간 빙고 × SECRET MBTI</h1><div style="opacity:.8">대학원 연합 네트워킹 · 실시간 게임</div></div><nav><button class="ghost" onclick="switchView('participant')">참가자</button><button class="ghost" onclick="switchView('screen')">대형 스크린</button><button class="ghost" onclick="switchView('admin')">관리자</button></nav></header><main class="wrap" id="root"></main><footer>행사 운영용 웹앱 · 비밀 인물의 MBTI는 정답 공개 전까지 숨겨집니다.</footer><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),root=document.getElementById('root');let view=new URLSearchParams(location.search).get('view')||'participant',state=null,playerId=localStorage.getItem('bingo-player-id'),playerName=localStorage.getItem('bingo-player-name')||'',admin=false,adminPeople=[],myVotes={},bingoNames=Array(25).fill(''),bingoClaimed=false,chosen=0;const specials={0:'학과 대표',4:'동아리 회장',12:'학생회 임원',20:'대학원 선배',24:'교수님과 동문'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function switchView(v){view=v;history.replaceState(null,'','?view='+v);render()}function emitAck(event,data,cb){socket.emit(event,data,r=>{if(r?.error)alert(r.error);else cb?.(r)})}socket.on('state',s=>{state=s;render()});socket.on('adminData',p=>{adminPeople=p;render()});socket.on('connect',()=>{if(playerId&&playerName)socket.emit('join',{name:playerName,id:playerId},r=>{if(r?.id){playerId=r.id;loadMine()}})});function loadMine(){socket.emit('myData',{playerId},r=>{myVotes=r.votes||{};if(r.bingo){bingoNames=r.bingo.names;bingoClaimed=r.bingo.claimed}render()})}function join(){const name=document.getElementById('nickname')?.value.trim();if(!name)return alert('닉네임을 입력하세요');emitAck('join',{name,id:playerId},r=>{playerId=r.id;playerName=name;localStorage.setItem('bingo-player-id',playerId);localStorage.setItem('bingo-player-name',name);loadMine()})}function login(){emitAck('admin',{pin:document.getElementById('pin').value},()=>{admin=true;render()})}function control(action,value){emitAck('control',{action,value})}function savePeople(){const people=Array.from({length:5},(_,i)=>({name:document.getElementById('p'+i).value.trim(),mbti:document.getElementById('m'+i).value.toUpperCase().trim()}));emitAck('settings',{people},()=>alert('저장되었습니다'))}function submitBingo(claimed){bingoNames=Array.from(document.querySelectorAll('.bingo input')).map(e=>e.value);emitAck('bingo',{names:bingoNames,claimed,playerId},()=>{bingoClaimed=claimed;alert('빙고판이 제출되었습니다')})}function vote(id,choice){emitAck('vote',{id,choice,round:state.round,playerId},()=>{myVotes[`${state.round}:${id}`]=choice;render()})}function personCards(){return `<div class="five">${state.people.map(p=>`<div class="person"><div class="avatar">👤</div><strong>${esc(p.name)}</strong><div class="big" style="font-size:clamp(15px,2.4vw,28px)">${esc(p.mbti||'????')}</div></div>`).join('')}</div>`}function bingoForm(){return `<section class="card"><h2>인간 빙고 5×5</h2><p class="muted">각 조건에 해당하는 사람과 대화한 뒤 이름을 적으세요. 파란 칸은 특별 미션입니다. 한 사람의 이름은 한 번만 사용하세요.</p><div class="bingo">${bingoNames.map((name,i)=>`<input class="${specials[i]?'special':''}" aria-label="${specials[i]||'빙고 '+(i+1)}" title="${specials[i]||'빙고 '+(i+1)}" placeholder="${specials[i]||'이름'}" value="${esc(name)}">`).join('')}</div><p class="small muted">빙고판의 일반 칸은 현장 배부용 빙고판의 조건에 따라 작성합니다. 제출 시 운영진이 현장에서 검증합니다.</p><div class="row"><button onclick="submitBingo(false)">임시 저장</button><button onclick="submitBingo(true)">빙고 완성! 제출</button><span class="tag">${bingoClaimed?'제출 완료':'진행 중'}</span></div></section>`}function voting(){let r=state.rounds[state.round];return `<section class="card"><div class="row"><span class="tag">ROUND ${state.round+1}/4 · ${esc(r.title)}</span><span class="tag">${state.open?'투표 진행 중':state.reveal?'정답 공개':'투표 대기'}</span></div><div class="question">${esc(r.question)}</div><p class="muted" style="text-align:center">각 비밀 인물의 성향을 추리하세요. 한 인물당 한 번 선택하며 투표 중에는 수정할 수 있습니다.</p>${state.people.map(p=>`<div class="card" style="background:#f5f7fc"><h3>${esc(p.name)} ${p.mbti?`<span class="tag">정답 ${esc(p.mbti)}</span>`:''}</h3><div class="answers">${r.options.map(o=>`<button ${!state.open||!playerId?'disabled':''} class="${myVotes[`${state.round}:${p.id}`]===o?'selected':''}" onclick="vote(${p.id},'${o}')">${o}</button>`).join('')}</div></div>`).join('')}</section>`}function participant(){if(!playerId)return `<section class="card" style="text-align:center"><h2>게임 참가하기</h2><p>닉네임을 입력하면 인간 빙고와 MBTI 추리에 참여할 수 있습니다.</p><input id="nickname" type="text" maxlength="32" placeholder="닉네임"><button onclick="join()">입장하기</button></section>`;return `<section class="card"><div class="row"><h2>안녕하세요, ${esc(playerName)}님!</h2><span class="tag">참가 ${state.playerCount}명</span></div><p>현재 단계: <strong>${{waiting:'행사 대기',bingo:'인간 빙고',mbti:'MBTI 추리',finished:'게임 종료'}[state.phase]}</strong></p></section>${state.phase==='bingo'?bingoForm():state.phase==='mbti'?voting():`<section class="card"><h2>${state.phase==='finished'?'게임이 종료되었습니다':'곧 게임이 시작됩니다'}</h2>${personCards()}</section>`}${state.reveal?`<section class="card"><h2>현재 순위</h2>${leaderboard()}</section>`:''}`}function leaderboard(){return `<div>${state.leaderboard.map((p,i)=>`<p><strong>${i+1}위 ${esc(p.name)}</strong> · ${p.score===null?'정답 공개 후 집계':p.score+'점'} ${p.bingo?'· 빙고 제출':''}</p>`).join('')||'아직 참가자가 없습니다'}</div>`}function tally(){const r=state.rounds[state.round];return state.people.map((p,i)=>{let a=state.counts[i][r.options[0]]||0,b=state.counts[i][r.options[1]]||0,t=a+b;return `<div class="card"><h3>${esc(p.name)} ${p.mbti?`· ${esc(p.mbti)}`:''}</h3><div class="row"><strong>${r.options[0]} ${a}표</strong><div class="bar" style="flex:1;min-width:100px"><span style="width:${t?100*a/t:0}%"></span></div><strong>${r.options[1]} ${b}표</strong></div><p class="muted small">총 ${t}표</p></div>`}).join('')}function screen(){return `<div class="screen"><section class="card"><div class="tag" style="display:inline-block">SECRET MBTI LIVE</div><h2 class="big">${state.phase==='bingo'?'인간 빙고!':state.phase==='mbti'?'비밀 인물의 MBTI를 맞혀라!':state.phase==='finished'?'최종 결과 발표':'게임에 참여하세요!'}</h2><div class="grid" style="align-items:center"><div><img class="qr" src="/qr.png" alt="참가 QR코드"><p><strong>QR코드를 스캔해 입장하세요</strong></p><p class="small muted">${esc(location.origin)}/?view=participant</p></div><div><div class="stat">${state.playerCount}명</div><p>현재 접속 등록 참가자</p><div class="stat">${state.bingoCount}명</div><p>빙고 완료 제출</p></div></div></section>${personCards()}${state.phase==='mbti'?`<section class="card"><h2>ROUND ${state.round+1} · ${esc(state.rounds[state.round].title)}</h2><div class="question">${esc(state.rounds[state.round].question)}</div><p>${state.open?'지금 투표하세요!':state.reveal?'정답 공개!':'MC의 안내를 기다려 주세요'}</p></section>${tally()}`:''}${state.phase==='finished'||state.reveal?`<section class="card"><h2>참가자 순위</h2>${leaderboard()}</section>`:''}</div>`}function adminView(){if(!admin)return `<section class="card"><h2>관리자 로그인</h2><p>관리자 PIN을 입력하세요. 초기 PIN은 README에 안내되어 있습니다.</p><input id="pin" type="password" placeholder="관리자 PIN"><button onclick="login()">로그인</button></section>`;return `<section class="card"><h2>게임 단계 제어</h2><div class="row">${[['waiting','대기'],['bingo','빙고 시작'],['mbti','MBTI 시작'],['finished','종료']].map(([v,l])=>`<button class="${state.phase===v?'':'ghost'}" onclick="control('phase','${v}')">${l}</button>`).join('')}</div><p>현재 단계: <strong>${esc(state.phase)}</strong> · 등록 ${state.playerCount}명 · 빙고 제출 ${state.bingoCount}명</p></section><section class="card"><h2>MBTI 라운드</h2><div class="row">${state.rounds.map((r,i)=>`<button class="${state.round===i?'':'ghost'}" onclick="control('round',${i})">${i+1}. ${esc(r.title)}</button>`).join('')}</div><p class="question">${esc(state.rounds[state.round].question)}</p><div class="row"><button onclick="control('open',true)">투표 시작</button><button class="ghost" onclick="control('open',false)">투표 마감</button><button onclick="control('reveal',true)">정답 공개</button><button class="ghost" onclick="control('reveal',false)">정답 숨기기</button></div></section><section class="card"><h2>실시간 투표 집계</h2>${tally()}</section><section class="card settings"><h2>비밀 인물 5명 설정</h2><p class="muted">MBTI는 E/I, S/N, T/F, J/P 순서로 입력합니다. 게임 시작 전에 설정하세요.</p>${adminPeople.map((p,i)=>`<div class="row" style="margin:9px 0"><strong>${i+1}번</strong><input id="p${i}" value="${esc(p.name)}" placeholder="이름"><input id="m${i}" value="${esc(p.mbti)}" maxlength="4" placeholder="ENTJ"></div>`).join('')}<button onclick="savePeople()">인물 정보 저장</button></section><section class="card"><h2>관리자 도구</h2><p class="muted">초기화하면 참가자, 투표, 빙고 데이터가 모두 삭제됩니다.</p><button class="danger" onclick="if(confirm('정말 모든 게임 데이터를 초기화할까요?'))control('reset')">전체 게임 초기화</button></section>`}function render(){if(!state)return;root.innerHTML=view==='admin'?adminView():view==='screen'?screen():participant()}
</script></body></html>
